services:
  # Conteneur 1 : Base de données PostgreSQL
  postgres-db:
    image: postgres:16-alpine
    container_name: newtrading_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-newtrading}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Persistance des données
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-newtrading}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Conteneur 2 : API Spring Boot
  backend-api:
    build: .
    container_name: newtrading_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # L'hôte réseau correspond au nom du service Docker : postgres-db
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB:-newtrading}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
