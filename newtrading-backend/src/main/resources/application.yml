spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/newtrading_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate # 'validate' vérifie que le code JPA correspond à votre script SQL existant
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  security:
    jwt:
      # Clé de 256 bits générée en Base64 (À garder confidentielle !)
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000 # Validité de 24 heures en millisecondes
